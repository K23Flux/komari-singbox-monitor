name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test
        run: make test
      - name: Build package
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: komari-singbox-monitor
          path: dist/*
