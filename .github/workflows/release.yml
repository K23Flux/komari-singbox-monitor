name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'K23Flux/komari-singbox-monitor'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Withdraw superseded prerelease with personal examples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            old_sha="$(gh api repos/K23Flux/komari-singbox-monitor/git/ref/tags/v0.1.0 --jq '.object.sha')"
            test "$old_sha" = e187e2449b94f2e4efc908edddceff4badaa9626
            gh release delete v0.1.0 --yes --cleanup-tag
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./plugin/komari-plugin.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: First-install compatibility regression
        run: node --test tests/first-install.test.js
      - name: Test and build
        run: bash build.sh
      - name: Verify downloadable checksum
        working-directory: dist
        run: sha256sum -c *.sha256
      - name: Publish only a new version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" --title "Sing-box Monitor $RELEASE_TAG" \
            --notes "修复首次安装缺少 state.json 时的 GoError，并防止加载失败后覆盖原数据。自动构建通过不等同于真实 Komari 主机验收，请先在测试机器部署。" \
            --prerelease
